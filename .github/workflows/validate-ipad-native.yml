name: Validate CourtLine iPad native sources
on:
  push:
    branches: [main]
    paths:
      - updates/ios-validation/request.json
permissions:
  contents: read
concurrency:
  group: courtline-ipad-native-validation
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and unpack exact source snapshot
        run: python3 updates/ios-validation/verify_snapshot.py
      - name: Typecheck and compile native iOS sources without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swiftc --version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          export SDKROOT="$SDK"
          echo "Apple iOS SDK: $SDKROOT"
          ROOT="$RUNNER_TEMP/courtline-ipad-native/Courtline-iPad.swiftpm"
          SOURCES=()
          while IFS= read -r -d '' f; do SOURCES+=("$f"); done < <(find "$ROOT" -maxdepth 1 -type f -name '*.swift' ! -name 'Package.swift' -print0)
          test "${#SOURCES[@]}" -ge 4
          xcrun --sdk iphoneos swiftc -swift-version 5 -parse-as-library -typecheck -sdk "$SDK" -target arm64-apple-ios18.0 -module-name AppModule "${SOURCES[@]}"
          xcrun --sdk iphoneos swiftc -swift-version 5 -parse-as-library -emit-executable -sdk "$SDK" -target arm64-apple-ios18.0 -module-name AppModule "${SOURCES[@]}" -o "$RUNNER_TEMP/CourtlineNativeValidation"
          echo 'Native source typecheck and unsigned link passed. Playgrounds package manifest, install, camera, network and runtime were not tested.' >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise shipping broker with fake macOS transport
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT="$SDK"
          cat "$RUNNER_TEMP/courtline-ipad-native/Courtline-iPad.swiftpm/CourtlineSessionBroker.swift" updates/ios-validation/WidgetRuntime.swift > "$RUNNER_TEMP/WidgetRuntime.swift"
          xcrun --sdk macosx swiftc -swift-version 5 -parse-as-library -sdk "$SDK" "$RUNNER_TEMP/WidgetRuntime.swift" -o "$RUNNER_TEMP/WidgetRuntime"
          python3 -c 'import os,subprocess; subprocess.run([os.environ["RUNNER_TEMP"]+"/WidgetRuntime"],check=True,timeout=60)'
          echo 'Actual shipping Swift broker runtime checks passed on macOS using fake transport only; not physical iOS runtime.' >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise enrollment diagnostics with fake macOS transport
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT="$SDK"
          cat "$RUNNER_TEMP/courtline-ipad-native/Courtline-iPad.swiftpm/CourtlineSessionBroker.swift" updates/ios-validation/PairingRuntime.swift > "$RUNNER_TEMP/PairingRuntime.swift"
          xcrun --sdk macosx swiftc -swift-version 5 -parse-as-library -sdk "$SDK" "$RUNNER_TEMP/PairingRuntime.swift" -o "$RUNNER_TEMP/PairingRuntime"
          python3 -c 'import os,subprocess; subprocess.run([os.environ["RUNNER_TEMP"]+"/PairingRuntime"],check=True,timeout=120)'
          echo 'Actual shipping Swift enrollment diagnostics passed on macOS using fake transport only; no physical iPad or live network test.' >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise credential-free health diagnostics with fake macOS transport
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT="$SDK"
          ROOT="$RUNNER_TEMP/courtline-ipad-native/Courtline-iPad.swiftpm"
          cat "$ROOT/CourtlineSessionBroker.swift" "$ROOT/ConnectionDiagnostics.swift" updates/ios-validation/HealthRuntime.swift > "$RUNNER_TEMP/HealthRuntime.swift"
          xcrun --sdk macosx swiftc -swift-version 5 -parse-as-library -sdk "$SDK" "$RUNNER_TEMP/HealthRuntime.swift" -o "$RUNNER_TEMP/HealthRuntime"
          python3 -c 'import os,subprocess; subprocess.run([os.environ["RUNNER_TEMP"]+"/HealthRuntime"],check=True,timeout=60)'
          echo 'Credential-free health and executable-identity checks passed with fake transport only; not physical iPad or LAN testing.' >> "$GITHUB_STEP_SUMMARY"
